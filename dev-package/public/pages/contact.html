<style>
:root{--navy:#0A2540;--green:#00A878;--green-dark:#007a57;--green-light:#e6f7f2;--warm:#F7F6F3;--warm-white:#FEFCF7;--slate:#3D4D5C;--slate-light:#6B7A8D;--slate-muted:#9aabba;--border:#E2E8F0}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--slate);background:var(--warm);-webkit-font-smoothing:antialiased;line-height:1.7}
main{width:min(100% - 2rem,720px);margin:0 auto;padding:clamp(2rem,5vw,3.5rem) 0 4rem;display:flex;flex-direction:column;gap:0}
.eyebrow{display:inline-flex;align-items:center;gap:.65rem;background:rgba(0,168,120,.12);border:1px solid rgba(0,168,120,.2);color:var(--green-dark);font-size:11px;font-weight:700;padding:7px 12px;border-radius:999px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:1rem;width:fit-content}
h1{font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.1;color:var(--navy);margin-bottom:.5rem;letter-spacing:-.02em}
.lede{font-size:1.05rem;color:var(--slate-light);line-height:1.75;margin-bottom:2.5rem;padding-bottom:2rem;border-bottom:1px solid var(--border)}
.prose-section{margin-bottom:2.5rem}
.prose-section h2{font-size:1.1rem;font-weight:700;color:var(--navy);margin-bottom:.85rem;padding-bottom:.5rem;border-bottom:2px solid var(--green);display:inline-block}
.prose-section p{font-size:.97rem;color:var(--slate);line-height:1.8;margin-bottom:.85rem}
.contact-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:1.25rem 1.5rem;margin-top:.75rem;display:flex;flex-direction:column;gap:.85rem}
.contact-card .row{display:flex;flex-direction:column;gap:.15rem}
.contact-card strong{font-size:.82rem;color:var(--slate-light);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.contact-card a{color:var(--green-dark);font-size:1rem;text-decoration:none;font-weight:600}
.contact-card a:hover{text-decoration:underline}
.contact-card span.val{font-size:1rem;color:var(--navy);font-weight:600}
[data-company-row][hidden]{display:none}
</style>
</head>
<body>

<div id="dm-header"></div>

<main>
  <div class="eyebrow">Contact</div>
  <h1>Contact The Doc Mirror</h1>
  <p class="lede">Questions, feedback, or partnership ideas? Reach our team below &mdash; we typically respond within one business day.</p>

  <div class="prose-section">
    <h2>Get in touch</h2>
    <div class="contact-card">
      <!-- Support email — single source of truth: lib/company.js SUPPORT_EMAIL -->
      <div class="row" data-company-row hidden>
        <strong>Support email</strong>
        <a data-company="supportEmail" data-company-mailto href="#"></a>
      </div>
      <!-- Owning company — single source of truth: lib/company.js LEGAL_ENTITY -->
      <div class="row" data-company-row hidden>
        <strong>Company</strong>
        <span class="val" data-company="legalEntity"></span>
      </div>
      <!-- Registered address — appears only once REGISTERED_ADDRESS is filled in -->
      <div class="row" data-company-row hidden>
        <strong>Registered address</strong>
        <span class="val" data-company="registeredAddress"></span>
      </div>
      <!-- Phone — appears only once SUPPORT_PHONE is filled in -->
      <div class="row" data-company-row hidden>
        <strong>Phone</strong>
        <a data-company="supportPhone" data-company-tel href="#"></a>
      </div>
    </div>
    <p style="margin-top:1rem">Prefer self-serve? Visit the <a href="/help-center">Help Center</a> or browse the <a href="/resources">Resources</a>.</p>
  </div>
</main>

<div id="dm-footer"></div>
<script src="/js/layout.js" defer></script>
<script src="/js/branding.js" defer></script>
</body>
</html>
