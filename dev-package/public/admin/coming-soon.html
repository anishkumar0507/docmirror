<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Admin — The Doc Mirror</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

<!--
  Placeholder for the admin pages built in later steps. It exists so the
  navigation leads somewhere real and still admin-gated, instead of falling
  through to the public site's catch-all. Each route in server.js is repointed
  at its own page as that step lands.
-->
<div id="adm-gate" class="adm-gate">
  <div class="adm-spinner"></div>
  <p class="adm-gate-msg">Checking admin access…</p>
</div>

<div class="adm-app">
  <aside class="adm-side" id="adm-side"></aside>

  <div class="adm-content">
    <header class="adm-bar" id="adm-bar"></header>

    <div class="adm-body">
      <section class="adm-panel">
        <div class="adm-empty">
          <strong id="empty-title">Not built yet</strong>
          <p id="empty-body">This part of the CMS is scheduled for a later step.</p>
          <div style="display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center">
            <a class="adm-action adm-action--primary" href="/admin/blogs/new">+ Add Blog</a>
            <a class="adm-action" href="/admin">← Back to dashboard</a>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>

<script src="/admin/admin-auth.js"></script>
<script src="/admin/admin-shell.js"></script>
<script>
(function () {
  'use strict';

  var PAGES = {
    '/admin/blogs':      { key: 'blogs',      title: 'Manage Blogs', step: 'The blog list, search and filters' },
    '/admin/media':      { key: 'media',      title: 'Media',        step: 'The media library screen' },
    '/admin/categories': { key: 'categories', title: 'Categories',   step: 'Category management' }
  };

  var page = PAGES[window.location.pathname] || { key: '', title: 'Admin', step: 'This section' };

  document.title = page.title + ' — The Doc Mirror Admin';
  document.getElementById('empty-title').textContent = page.step + ' is not built yet';
  document.getElementById('empty-body').textContent =
    'The dashboard and the blog editor are live — use “+ Add Blog” to create a post. ' +
    page.step + ' arrives in the next step.';

  AdminAuth.guard(function (admin) {
    AdminShell.mount({
      active: page.key,
      title: page.title,
      actions: '<a class="adm-btn adm-btn--sm" href="/admin/blogs/new" style="text-decoration:none">+ Add Blog</a>',
    });
    AdminShell.setEmail(admin.email || admin.id);
  });
})();
</script>

</body>
</html>
